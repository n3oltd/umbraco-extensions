<div>
    <ng-form name="contentBlocksForm">
        <input type="hidden" name="contentBlocks" ng-model="model.value" val-server="value" />

        <div ng-messages="contentBlocksForm.contentBlocks.$error" show-validation-on-submit>
            <div class="alert alert-error property-error" ng-message="valServer">{{contentBlocksForm.contentBlocks.errorMsg}}</div>
        </div>
    </ng-form>

    <div ng-include="'/App_Plugins/Perplex.ContentBlocks/perplex.content-blocks.html'"></div>
</div>
